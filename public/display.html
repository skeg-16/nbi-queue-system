<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBI Queue Display</title>
    <link rel="icon" type="image/png" href="/assets/nbi.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="display-body">
    <!-- Voice Setup Overlay -->
    <div id="voice-overlay" class="overlay-unlock">
        <img src="/assets/nbi.png" alt="NBI Logo" class="overlay-logo">
        <h1>NBI Cybercrime Division</h1>
        <h2>Queue Display System</h2>
        <div class="tap-text">Tap anywhere to activate display</div>
        <div class="sub-text">Audio announcements will be enabled</div>
    </div>

    <div class="display-container">
        <!-- Header Section -->
        <header class="header">
            <div class="brand">
                <img src="/assets/nbi.png" alt="NBI Logo" style="height: 60px; object-fit: contain;">
                <div class="brand-text">
                    <div class="brand-title">NBI Cybercrime Division</div>
                </div>
            </div>
            <div class="datetime-container">
                <div class="time" id="time">00:00:00</div>
                <div class="date" id="date">Loading...</div>
            </div>
            <button class="fullscreen-btn" id="btn-fullscreen" title="Toggle Fullscreen">⛶</button>
        </header>

        <!-- Main Display Section -->
        <main class="main-content">
            <div class="serving-label">Now Serving</div>
            <div class="serving-priority-badge" id="priority-badge" style="display: none;">PRIORITY</div>
            <div class="queue-number-box" id="queue-box">
                <div class="queue-number" id="queue-number">---</div>
            </div>
            <div id="serving-timer-container" style="display: none; margin-top: 25px; font-size: 1.8rem; color: var(--text-muted); font-family: 'Google Sans Code', monospace; background: rgba(0,0,0,0.2); padding: 12px 35px; border-radius: 50px; border: 1px solid var(--border-color); align-items: center; gap: 15px;">
                <span style="display: inline-block; width: 14px; height: 14px; background: #28a745; border-radius: 50%; box-shadow: 0 0 10px #28a745; animation: pulse 1.5s infinite;"></span>
                Time Inside: <span id="serving-timer" style="font-weight: 700; color: var(--text-main);">00:00</span>
            </div>
            <style>
                @keyframes pulse {
                    0% { opacity: 1; transform: scale(1); }
                    50% { opacity: 0.4; transform: scale(0.8); }
                    100% { opacity: 1; transform: scale(1); }
                }
            </style>
        </main>

        <!-- Footer / Recently Served -->
        <div class="recent-container">
            <div class="recent-label">Previously Served</div>
            <ul class="recent-list" id="recent-list">
                <li class="recent-item">---</li>
            </ul>
        </div>
    </div>

    <!-- Audio for chime -->
    <audio id="chime" src="assets/chime.mp3" preload="auto"></audio>
    <!-- Audio for chime -->
    <audio id="chime" src="assets/chime.mp3" preload="auto"></audio>

    <!-- Settings and Voice controls moved to Staff Dashboard -->

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const queueNumberEl = document.getElementById('queue-number');
        const queueBoxEl = document.getElementById('queue-box');
        const priorityBadgeEl = document.getElementById('priority-badge');
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const recentListEl = document.getElementById('recent-list');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        
        const servingTimerContainer = document.getElementById('serving-timer-container');
        const servingTimerEl = document.getElementById('serving-timer');
        let servingTimerInterval;

        // Clock Update
        function updateDateTime() {
            const now = new Date();
            timeEl.textContent = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Web Audio API for Chime Sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playChimeSound(isPriority = false) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const playNote = (frequency, startTime, duration) => {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime + startTime);

                gainNode.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
                gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + startTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start(audioCtx.currentTime + startTime);
                oscillator.stop(audioCtx.currentTime + startTime + duration);
            };

            if (isPriority) {
                // Priority tone: two quick tones (around 1000 Hz), 0.4s each with gap
                playNote(1000, 0, 0.4);
                playNote(1000, 0.5, 0.4);
            } else {
                // Regular tone: single tone 700 Hz, 0.8s
                playNote(700, 0, 0.8);
            }
        }

        // Web Speech API Voice System
        let voices = [];
        let filipinoVoice = null;
        let selectedVoice = null;
        let audioUnlocked = false;
        let lastAnnouncement = null;

        let currentLang = 'en';
        let currentRate = 0.85;

        const overlay = document.getElementById('voice-overlay');

        socket.on('voice_settings_update', (settings) => {
            currentLang = settings.lang || 'en';
            currentRate = settings.rate || 0.85;
            
            if (settings.voiceURI && voices.length > 0) {
                var match = voices.find(function(v) { return v.voiceURI === settings.voiceURI; });
                if (match) {
                    selectedVoice = match;
                }
            } else if (!settings.voiceURI && voices.length > 0) {
                selectedVoice = getBestVoice(voices); // revert to system choice
            }
        });

        socket.on('trigger_test_voice_display', () => {
            playVoiceAnnouncement('13', false, true, 'Test Person');
        });

        // Unlock audio context and initialize Speech Synthesis on first interaction
        overlay.addEventListener('click', function () {
            audioUnlocked = true;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // Warm up audio elements to bypass Autoplay policies
            let p = sfxBefore.play();
            if (p !== undefined) {
                p.then(() => { sfxBefore.pause(); sfxBefore.currentTime = 0; }).catch(() => {});
            }

            // Warm-up utterance
            if ('speechSynthesis' in window) {
                var dummy = new SpeechSynthesisUtterance('');
                dummy.volume = 0;
                window.speechSynthesis.speak(dummy);
            }

            overlay.style.display = 'none';
        });

        // Robust async voice loading
        function loadVoicesAsync() {
            return new Promise(function (resolve) {
                if (!('speechSynthesis' in window)) {
                    resolve([]);
                    return;
                }
                var initialVoices = window.speechSynthesis.getVoices();
                if (initialVoices.length > 0) {
                    resolve(initialVoices);
                    return;
                }
                window.speechSynthesis.addEventListener('voiceschanged', function () {
                    resolve(window.speechSynthesis.getVoices());
                }, { once: true });
            });
        }

        function getBestVoice(voicesList) {
            if (voicesList.length === 0) return null;

            const priorityNames = [
                'natasha',
                'microsoft jenny online',
                'microsoft aria online',
                'google uk english female',
                'samantha',
                'karen',
                'victoria',
                'google us english',
                'microsoft hazel',
                'microsoft catherine',
                'microsoft susan',
                'microsoft heera',
                'microsoft zira'
            ];

            for (var i = 0; i < priorityNames.length; i++) {
                var match = voicesList.find(function (v) { return v.name.toLowerCase().includes(priorityNames[i]); });
                if (match) return match;
            }

            // Fallback 1: Any voice explicitly containing "Female"
            var femaleMatch = voicesList.find(function (v) { return v.name.toLowerCase().includes('female'); });
            if (femaleMatch) return femaleMatch;

            // Fallback 2: Any English voice that is NOT explicitly male
            const maleNames = ['david', 'mark', 'guy', 'george', 'daniel', 'arthur', 'male'];
            var englishVoices = voicesList.filter(function(v) { return v.lang.startsWith('en'); });
            
            // Prefer PH/US English first among non-male voices
            var nonMalePH = englishVoices.find(function(v) {
                var lowerName = v.name.toLowerCase();
                return v.lang.startsWith('en-PH') && !maleNames.some(function(m) { return lowerName.includes(m); });
            });
            if (nonMalePH) return nonMalePH;

            var nonMaleUS = englishVoices.find(function(v) {
                var lowerName = v.name.toLowerCase();
                return v.lang.startsWith('en-US') && !maleNames.some(function(m) { return lowerName.includes(m); });
            });
            if (nonMaleUS) return nonMaleUS;

            var nonMaleAny = englishVoices.find(function(v) {
                var lowerName = v.name.toLowerCase();
                return !maleNames.some(function(m) { return lowerName.includes(m); });
            });
            if (nonMaleAny) return nonMaleAny;

            // Last resort
            return englishVoices.find(function (v) { return v.lang.startsWith('en-US'); }) || voicesList[0];
        }

        function loadAndSelectVoices() {
            loadVoicesAsync().then(function (v) {
                // Strictly filter to English voices only
                var englishVoices = Array.from(v).filter(function(voice) {
                    return voice.lang.startsWith('en');
                });

                // Preferred lively/natural English voices
                var preferredNames = [
                    'natasha', 'aria', 'jenny', 'ana', 'michelle', 'guy', 'samantha', 'victoria', 
                    'karen', 'rosa', 'james', 'online', 'natural'
                ];
                
                // Filter English voices that match our preferred lively list
                var customVoicesList = englishVoices.filter(function(voice) {
                    var lower = voice.name.toLowerCase();
                    return preferredNames.some(p => lower.includes(p));
                });
                
                // If we have fewer than 10 voices, fill up the rest with any other English voices
                if (customVoicesList.length < 10) {
                    for (let i = 0; i < englishVoices.length && customVoicesList.length < 15; i++) {
                        if (!customVoicesList.includes(englishVoices[i])) {
                            customVoicesList.push(englishVoices[i]);
                        }
                    }
                }
                
                // Fallback if somehow still empty
                if (customVoicesList.length === 0) {
                    customVoicesList = englishVoices.slice(0, 15); 
                } else {
                    // Limit to 15 voices to keep the dropdown clean
                    customVoicesList = customVoicesList.slice(0, 15);
                }
                
                voices = customVoicesList;
                
                // Set Natasha as absolute default for a lively voice, fallback to Aria, Jenny, etc.
                selectedVoice = voices.find(function(v) { 
                    return v.name.toLowerCase().includes('natasha');
                }) || voices.find(function(v) { 
                    var lower = v.name.toLowerCase();
                    return lower.includes('aria') || lower.includes('jenny') || lower.includes('samantha'); 
                }) || voices[0];

                // Send voices to server so staff can see them!
                const simpleVoices = customVoicesList.map(voice => ({ name: voice.name, lang: voice.lang, voiceURI: voice.voiceURI }));
                socket.emit('register_display_voices', simpleVoices);
                
                // Tell staff what the actual selected default voice is
                socket.emit('update_voice_settings', { voiceURI: selectedVoice.voiceURI });
            });
        }
        
        // Execute voice loading immediately on startup so spreadsheet sees it
        loadAndSelectVoices();

        // Audio SFX Setup
        const sfxBefore = new Audio('assets/sound.mp3');

        // Voice Split logic
        function speakParts(parts, index) {
            if (index >= parts.length) {
                return;
            }

            var part = parts[index];
            var utterance = new SpeechSynthesisUtterance(part.text);
            if (part.voice) {
                utterance.voice = part.voice;
            }
            utterance.rate = part.rate;
            utterance.pitch = part.pitch;
            utterance.volume = part.volume;

            utterance.onend = function () {
                speakParts(parts, index + 1);
            };

            utterance.onerror = function (e) {
                console.warn('Speech synthesis error:', e);
                speakParts(parts, index + 1);
            };

            window.speechSynthesis.speak(utterance);
        }

        // Voice Announcement Logic
        function playVoiceAnnouncement(numberStr, isPriority, skipDelay, complainantName, isRepeat) {
            if (isPriority === undefined) isPriority = false;
            if (skipDelay === undefined) skipDelay = false;
            if (complainantName === undefined) complainantName = "";
            if (isRepeat === undefined) isRepeat = false;

            if (!audioUnlocked || !('speechSynthesis' in window) || !selectedVoice) {
                if (!audioUnlocked) console.warn('Voice announcement skipped: Audio not unlocked.');
                return;
            }

            var rawNum = numberStr.replace('#', '').trim();
            var num = rawNum.replace(/^0+/, '');
            if (num === '') num = '0';

            // Always force English text for the lively voice as requested
            var useFilipino = false; 
            
            // Force Natasha's voice if available, otherwise fallback to the selected one
            var allVoices = window.speechSynthesis.getVoices();
            var natasha = allVoices.find(function(v) { return v.name.toLowerCase().includes('natasha'); });
            var voiceToUse = natasha || selectedVoice;
            
            var baseRate = parseFloat(currentRate) || 0.85;

            var delay = skipDelay ? 0 : 600;

            setTimeout(function () {
                // Cancel any ongoing speech and audio only if necessary to prevent wedging Chrome
                if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
                    window.speechSynthesis.cancel();
                }
                sfxBefore.pause();
                sfxBefore.currentTime = 0;
                sfxBefore.onended = null; // FIX: Prevent double firing from previous play requests

                var parts = [];
                var fullText = "";

                if (isPriority) {
                    fullText = (isRepeat ? "Calling again. Priority number " : "Calling Priority number ") + num + ", please proceed to interview room.";
                    parts.push({ text: fullText, rate: baseRate, pitch: 1.0, volume: 1.0, voice: voiceToUse });
                } else {
                    fullText = (isRepeat ? "Calling again. Number " : "Calling Number ") + num + ", please proceed to interview room.";
                    parts.push({ text: fullText, rate: baseRate, pitch: 1.0, volume: 1.0, voice: voiceToUse });
                }

                // Function to actually trigger speech
                function triggerSpeech() {
                    if (voiceToUse && voiceToUse.voiceURI === 'cloud_tts') {
                        // Use backend proxy for TTS
                        const audioUrl = `/api/tts?text=${encodeURIComponent(fullText)}&lang=${useFilipino ? 'tl' : 'en'}`;
                        const cloudAudio = new Audio(audioUrl);
                        cloudAudio.play().catch(e => console.error("Cloud TTS Play Error:", e));
                    } else {
                        // Use Local Speech Synthesis
                        speakParts(parts, 0); 
                    }
                }

                var playPromise = sfxBefore.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // Audio started playing successfully.
                        // The sound file likely has trailing silence causing "dead air".
                        // Instead of waiting for it to finish completely (onended), we overlap the speech
                        // by starting it after exactly 1.2 seconds.
                        setTimeout(triggerSpeech, 1200);
                    }).catch(e => {
                        console.log('SFX before error:', e);
                        // If it fails to play, trigger speech immediately
                        setTimeout(triggerSpeech, 50);
                    });
                } else {
                    // For very old browsers
                    setTimeout(triggerSpeech, 1200);
                }

            }, delay);
        }

        socket.on('trigger_repeat', function () {
            if (lastAnnouncement) {
                playVoiceAnnouncement(lastAnnouncement.number, lastAnnouncement.isPriority, true, lastAnnouncement.name, true);
            }
        });

        function shortenCcd(ccd) {
            if (!ccd || ccd === '---') return '---';
            const parts = ccd.split('-');
            if (parts.length > 1) {
                return '#' + parts[parts.length - 1];
            }
            return ccd;
        }

        socket.on('display_update', (data) => {
            if (data.skipMessage) {
                // Show temporary skip message
                queueNumberEl.classList.add('is-text');
                queueNumberEl.textContent = data.skipMessage;

                setTimeout(() => {
                    queueNumberEl.classList.remove('is-text');
                    queueNumberEl.textContent = shortenCcd(data.currentlyServing);
                }, 3000);
            } else {
                queueNumberEl.classList.remove('is-text');
                queueNumberEl.textContent = shortenCcd(data.currentlyServing);

                if (data.isPriority) {
                    priorityBadgeEl.style.display = 'inline-block';
                    queueNumberEl.classList.add('priority');
                    queueBoxEl.classList.add('priority');
                    queueNumberEl.style.color = '#ff3333';
                    queueNumberEl.style.textShadow = '0 0 30px rgba(255, 51, 51, 0.6)';
                } else {
                    priorityBadgeEl.style.display = 'none';
                    queueNumberEl.classList.remove('priority');
                    queueBoxEl.classList.remove('priority');
                    queueNumberEl.style.color = '';
                    queueNumberEl.style.textShadow = '';
                }

                if (data.triggerChime) {
                    playChimeSound(data.isPriority);

                    // Trigger Voice Announcement
                    const cleanNum = shortenCcd(data.currentlyServing);
                    lastAnnouncement = { number: cleanNum, isPriority: data.isPriority, name: data.currentlyServingName };
                    playVoiceAnnouncement(cleanNum, data.isPriority, false, data.currentlyServingName);

                    // Flash effect
                    const glowColor = data.isPriority ? 'rgba(204, 34, 34, 0.8)' : 'rgba(241, 196, 15, 0.8)';
                    queueBoxEl.style.transform = 'scale(1.05)';
                    queueBoxEl.style.boxShadow = `0 30px 80px ${glowColor}`;
                    setTimeout(() => {
                        queueBoxEl.style.transform = 'scale(1)';
                        queueBoxEl.style.boxShadow = '';
                    }, 500);
                }

                if (data.startTimestamp) {
                    servingTimerContainer.style.display = 'inline-flex';
                    clearInterval(servingTimerInterval);
                    
                    const updateTimer = () => {
                        const start = new Date(data.startTimestamp);
                        const diffMs = new Date() - start;
                        if (diffMs >= 0) {
                            const mins = Math.floor(diffMs / 60000).toString().padStart(2, '0');
                            const secs = Math.floor((diffMs % 60000) / 1000).toString().padStart(2, '0');
                            servingTimerEl.textContent = `${mins}:${secs}`;
                        }
                    };
                    updateTimer(); // immediate update
                    servingTimerInterval = setInterval(updateTimer, 1000);
                } else {
                    servingTimerContainer.style.display = 'none';
                    clearInterval(servingTimerInterval);
                }
            }

            // Update recent list
            recentListEl.innerHTML = '';
            if (data.recentNumbers.length === 0) {
                recentListEl.innerHTML = '<li class="recent-item">---</li>';
            } else {
                data.recentNumbers.forEach(num => {
                    const li = document.createElement('li');
                    li.className = 'recent-item';
                    li.textContent = shortenCcd(num);
                    recentListEl.appendChild(li);
                });
            }
        });

        // Fullscreen Toggle
        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // Heartbeat to keep Render awake
        setInterval(() => {
            fetch('/ping').catch(err => console.log('Heartbeat failed', err));
        }, 5 * 60 * 1000); // 5 minutes
    </script>
</body>

</html>
