<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBI Queue Display</title>
    <link rel="icon" type="image/png" href="/assets/nbi.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="display-body">
    <!-- Voice Setup Overlay -->
    <div id="voice-overlay" class="overlay-unlock">
        <img src="/assets/nbi.png" alt="NBI Logo" class="overlay-logo">
        <h1>NBI Cybercrime Division</h1>
        <h2>Queue Display System</h2>
        <div class="tap-text">Tap anywhere to activate display</div>
        <div class="sub-text">Audio announcements will be enabled</div>
    </div>

    <div class="display-container">
        <!-- Header Section -->
        <header class="header">
            <div class="brand">
                <img src="/assets/nbi.png" alt="NBI Logo" style="height: 60px; object-fit: contain;">
                <div class="brand-text">
                    <div class="brand-title">NBI Cybercrime Division</div>
                </div>
            </div>
            <div class="datetime-container">
                <div class="time" id="time">00:00:00</div>
                <div class="date" id="date">Loading...</div>
            </div>
            <button class="fullscreen-btn" id="btn-fullscreen" title="Toggle Fullscreen">⛶</button>
        </header>

        <!-- Main Display Section -->
        <main class="main-content">
            <div class="serving-label">Now Serving</div>
            <div class="serving-priority-badge" id="priority-badge" style="display: none;">PRIORITY</div>
            <div class="queue-number-box" id="queue-box">
                <div class="queue-number" id="queue-number">---</div>
            </div>
        </main>

        <!-- Footer / Recently Served -->
        <div class="recent-container">
            <div class="recent-label">Previously Served</div>
            <ul class="recent-list" id="recent-list">
                <li class="recent-item">---</li>
            </ul>
        </div>
    </div>

    <!-- Audio for chime -->
    <audio id="chime" src="assets/chime.mp3" preload="auto"></audio>
    <!-- Audio for chime -->
    <audio id="chime" src="assets/chime.mp3" preload="auto"></audio>

    <!-- Settings Panel Gear Icon -->
    <div id="settings-toggle" class="settings-gear" title="Voice Settings (Press S)">⚙️</div>

    <!-- Voice Settings Panel -->
    <div id="voice-settings-panel" class="voice-settings" style="display: none;">
        <h3>Voice Settings</h3>
        <label for="voice-select">Preferred Voice:</label>
        <select id="voice-select" class="settings-input"></select>
        
        <label for="rate-slider">Speech Rate: <span id="rate-value">0.85</span></label>
        <input type="range" id="rate-slider" class="settings-input" min="0.7" max="1.0" step="0.01" value="0.85">
        
        <button id="btn-test-voice" class="settings-btn">Test Voice</button>
        <button id="btn-close-settings" class="settings-btn secondary">Close</button>
    </div>

    <!-- Voice Controls -->
    <div class="voice-controls" id="voice-controls" style="display: none;">
        <select id="lang-toggle" class="voice-btn" style="display: none;" title="Toggle Announcement Language">
            <option value="en">EN</option>
            <option value="fil">FIL</option>
        </select>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const queueNumberEl = document.getElementById('queue-number');
        const queueBoxEl = document.getElementById('queue-box');
        const priorityBadgeEl = document.getElementById('priority-badge');
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const recentListEl = document.getElementById('recent-list');
        const btnFullscreen = document.getElementById('btn-fullscreen');

        // Clock Update
        function updateDateTime() {
            const now = new Date();
            timeEl.textContent = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Web Audio API for Chime Sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playChimeSound(isPriority = false) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const playNote = (frequency, startTime, duration) => {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime + startTime);
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
                gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + startTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start(audioCtx.currentTime + startTime);
                oscillator.stop(audioCtx.currentTime + startTime + duration);
            };

            if (isPriority) {
                // Priority tone: two quick tones (around 1000 Hz), 0.4s each with gap
                playNote(1000, 0, 0.4);
                playNote(1000, 0.5, 0.4);
            } else {
                // Regular tone: single tone 700 Hz, 0.8s
                playNote(700, 0, 0.8);
            }
        }

        // Web Speech API Voice System
        let voices = [];
        let filipinoVoice = null;
        let selectedVoice = null;
        let audioUnlocked = false;
        let lastAnnouncement = null; // { number: string, isPriority: boolean }
        let settingsTimeout = null;
        
        const overlay = document.getElementById('voice-overlay');
        const langToggle = document.getElementById('lang-toggle');
        const voiceControls = document.getElementById('voice-controls');
        
        // Settings elements
        const settingsToggle = document.getElementById('settings-toggle');
        const voiceSettingsPanel = document.getElementById('voice-settings-panel');
        const voiceSelect = document.getElementById('voice-select');
        const rateSlider = document.getElementById('rate-slider');
        const rateValue = document.getElementById('rate-value');
        const btnTestVoice = document.getElementById('btn-test-voice');
        const btnCloseSettings = document.getElementById('btn-close-settings');

        function initSettings() {
            const savedRate = localStorage.getItem('voice_rate');
            if (savedRate) {
                rateSlider.value = savedRate;
                rateValue.textContent = savedRate;
            }

            rateSlider.addEventListener('input', function() {
                rateValue.textContent = this.value;
                localStorage.setItem('voice_rate', this.value);
                resetSettingsTimeout();
            });

            voiceSelect.addEventListener('change', function() {
                var val = this.value;
                localStorage.setItem('preferred_voice_uri', val);
                selectedVoice = voices.find(function(v) { return v.voiceURI === val; }) || selectedVoice;
                resetSettingsTimeout();
            });

            btnTestVoice.addEventListener('click', function() {
                resetSettingsTimeout();
                playVoiceAnnouncement('13', false, true); // test number
            });

            btnCloseSettings.addEventListener('click', closeSettings);
            settingsToggle.addEventListener('click', openSettings);

            window.addEventListener('keydown', function(e) {
                if (e.key === 's' || e.key === 'S') {
                    if (voiceSettingsPanel.style.display === 'none') openSettings();
                    else closeSettings();
                }
            });
        }

        function resetSettingsTimeout() {
            if (settingsTimeout) clearTimeout(settingsTimeout);
            settingsTimeout = setTimeout(closeSettings, 10000);
        }

        function openSettings() {
            voiceSettingsPanel.style.display = 'flex';
            resetSettingsTimeout();
        }

        function closeSettings() {
            voiceSettingsPanel.style.display = 'none';
            if (settingsTimeout) clearTimeout(settingsTimeout);
        }

        // Unlock audio context and initialize Speech Synthesis on first interaction
        overlay.addEventListener('click', function() {
            audioUnlocked = true;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Warm-up utterance
            if ('speechSynthesis' in window) {
                var dummy = new SpeechSynthesisUtterance('');
                dummy.volume = 0;
                window.speechSynthesis.speak(dummy);
            }
            
            overlay.style.display = 'none';
            voiceControls.style.display = 'flex';
            
            loadAndSelectVoices();
            initSettings();
        });

        // Robust async voice loading
        function loadVoicesAsync() {
            return new Promise(function(resolve) {
                if (!('speechSynthesis' in window)) {
                    resolve([]);
                    return;
                }
                var initialVoices = window.speechSynthesis.getVoices();
                if (initialVoices.length > 0) {
                    resolve(initialVoices);
                    return;
                }
                window.speechSynthesis.addEventListener('voiceschanged', function() {
                    resolve(window.speechSynthesis.getVoices());
                }, { once: true });
            });
        }

        function getBestVoice(voicesList) {
            if (voicesList.length === 0) return null;
            
            const savedUri = localStorage.getItem('preferred_voice_uri');
            if (savedUri) {
                const saved = voicesList.find(function(v) { return v.voiceURI === savedUri; });
                if (saved) return saved;
            }

            const priorityNames = [
                'Microsoft Aria Online',
                'Microsoft Jenny Online',
                'Microsoft Guy Online',
                'Microsoft Zira',
                'Microsoft David',
                'Google US English',
                'Google UK English Female'
            ];

            for (var i = 0; i < priorityNames.length; i++) {
                var match = voicesList.find(function(v) { return v.name.includes(priorityNames[i]); });
                if (match) return match;
            }
            
            return voicesList.find(function(v) { return v.lang.startsWith('en-PH'); }) ||
                   voicesList.find(function(v) { return v.lang.startsWith('en-US'); }) ||
                   voicesList.find(function(v) { return v.lang.startsWith('en'); }) || 
                   voicesList[0];
        }

        function loadAndSelectVoices() {
            loadVoicesAsync().then(function(v) {
                voices = v;
                if (voices.length === 0) return;

                filipinoVoice = voices.find(function(v) { return v.lang.startsWith('fil') || v.lang.startsWith('tl'); });
                selectedVoice = getBestVoice(voices);

                if (filipinoVoice) {
                    langToggle.style.display = 'block';
                    const savedLang = localStorage.getItem('announcement_lang');
                    if (savedLang) langToggle.value = savedLang;
                }

                // Populate settings dropdown
                voiceSelect.innerHTML = '';
                voices.forEach(function(voice) {
                    var option = document.createElement('option');
                    option.value = voice.voiceURI;
                    option.textContent = voice.name + ' (' + voice.lang + ')';
                    if (selectedVoice && voice.voiceURI === selectedVoice.voiceURI) {
                        option.selected = true;
                    }
                    voiceSelect.appendChild(option);
                });
            });
        }

        langToggle.addEventListener('change', function(e) {
            localStorage.setItem('announcement_lang', e.target.value);
        });

        // Voice Split logic
        function speakParts(parts, index) {
            if (index >= parts.length) return;
            
            var part = parts[index];
            var utterance = new SpeechSynthesisUtterance(part.text);
            utterance.voice = part.voice;
            utterance.rate = part.rate;
            utterance.pitch = part.pitch;
            utterance.volume = part.volume;
            
            utterance.onend = function() {
                speakParts(parts, index + 1);
            };
            
            window.speechSynthesis.speak(utterance);
        }

        // Voice Announcement Logic
        function playVoiceAnnouncement(numberStr, isPriority, skipDelay) {
            if (isPriority === undefined) isPriority = false;
            if (skipDelay === undefined) skipDelay = false;

            if (!audioUnlocked || !('speechSynthesis' in window) || !selectedVoice) {
                if (!audioUnlocked) console.warn('Voice announcement skipped: Audio not unlocked.');
                return;
            }
            
            var rawNum = numberStr.replace('#', '').trim();
            var num = rawNum.replace(/^0+/, '');
            if (num === '') num = '0';
            
            var lang = langToggle.value || 'en';
            var useFilipino = lang === 'fil';
            var voiceToUse = selectedVoice;
            var baseRate = parseFloat(rateSlider.value) || 0.85;

            var delay = skipDelay ? 0 : 600;

            setTimeout(function() {
                window.speechSynthesis.cancel(); 

                var parts = [];
                
                if (isPriority) {
                    if (useFilipino) {
                        parts.push({ text: "Priority po.", rate: baseRate - 0.05, pitch: 1.0, volume: 1.0, voice: voiceToUse });
                        parts.push({ text: "Numero " + num + ".", rate: baseRate, pitch: 1.05, volume: 1.0, voice: voiceToUse });
                        parts.push({ text: "PWD o Senior Citizen, mangyaring pumunta na po sa loob.", rate: baseRate + 0.03, pitch: 1.0, volume: 1.0, voice: voiceToUse });
                    } else {
                        parts.push({ text: "Priority.", rate: baseRate - 0.05, pitch: 1.0, volume: 1.0, voice: voiceToUse });
                        parts.push({ text: "Now serving number " + num + ".", rate: baseRate, pitch: 1.05, volume: 1.0, voice: voiceToUse });
                        parts.push({ text: "PWD or Senior Citizen, please proceed inside.", rate: baseRate + 0.03, pitch: 1.0, volume: 1.0, voice: voiceToUse });
                    }
                } else {
                    if (useFilipino) {
                        parts.push({ text: "Susunod na po.", rate: baseRate, pitch: 1.05, volume: 1.0, voice: voiceToUse });
                        parts.push({ text: "Numero " + num + ".", rate: baseRate, pitch: 1.05, volume: 1.0, voice: voiceToUse });
                        parts.push({ text: "Mangyaring pumunta na po sa loob.", rate: baseRate + 0.03, pitch: 1.0, volume: 1.0, voice: voiceToUse });
                    } else {
                        parts.push({ text: "Now serving number " + num + ".", rate: baseRate, pitch: 1.05, volume: 1.0, voice: voiceToUse });
                        parts.push({ text: "Please proceed inside.", rate: baseRate + 0.03, pitch: 1.0, volume: 1.0, voice: voiceToUse });
                    }
                }

                speakParts(parts, 0);
            }, delay);
        }

        socket.on('trigger_repeat', function() {
            if (lastAnnouncement) {
                playVoiceAnnouncement(lastAnnouncement.number, lastAnnouncement.isPriority, true);
            }
        });

        function shortenCcd(ccd) {
            if (!ccd || ccd === '---') return '---';
            const parts = ccd.split('-');
            if (parts.length > 1) {
                return '#' + parts[parts.length - 1];
            }
            return ccd;
        }

        function updateDisplayCore(data) {
            queueNumberEl.classList.remove('is-text');
            queueNumberEl.textContent = shortenCcd(data.currentlyServing);
            
            if (data.isPriority) {
                priorityBadgeEl.style.display = 'inline-block';
                queueNumberEl.classList.add('priority');
                queueBoxEl.classList.add('priority');
                queueNumberEl.style.color = '';
                queueNumberEl.style.textShadow = '';
            } else {
                priorityBadgeEl.style.display = 'none';
                queueNumberEl.classList.remove('priority');
                queueBoxEl.classList.remove('priority');
                queueNumberEl.style.color = '';
                queueNumberEl.style.textShadow = '';
            }

            if (data.triggerChime) {
                playChimeSound(data.isPriority);
                
                // Trigger Voice Announcement
                const cleanNum = shortenCcd(data.currentlyServing);
                lastAnnouncement = { number: cleanNum, isPriority: data.isPriority };
                playVoiceAnnouncement(cleanNum, data.isPriority);
                
                // Flash effect
                const glowColor = data.isPriority ? 'rgba(204, 34, 34, 0.8)' : 'rgba(241, 196, 15, 0.8)';
                queueBoxEl.style.transform = 'scale(1.05)';
                queueBoxEl.style.boxShadow = `0 30px 80px ${glowColor}`;
                setTimeout(() => {
                    queueBoxEl.style.transform = 'scale(1)';
                    queueBoxEl.style.boxShadow = '';
                }, 500);
            }
        }

        socket.on('display_update', (data) => {
            if (data.skipMessage) {
                // Show temporary skip message
                queueNumberEl.classList.add('is-text');
                queueNumberEl.textContent = data.skipMessage;
                
                setTimeout(() => {
                    updateDisplayCore(data);
                }, 3000);
            } else {
                updateDisplayCore(data);
            }

            // Update recent list
            recentListEl.innerHTML = '';
            if (data.recentNumbers.length === 0) {
                recentListEl.innerHTML = '<li class="recent-item">---</li>';
            } else {
                data.recentNumbers.forEach(num => {
                    const li = document.createElement('li');
                    li.className = 'recent-item';
                    li.textContent = shortenCcd(num);
                    recentListEl.appendChild(li);
                });
            }
        });

        // Fullscreen Toggle
        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // Heartbeat to keep Render awake
        setInterval(() => {
            fetch('/ping').catch(err => console.log('Heartbeat failed', err));
        }, 5 * 60 * 1000); // 5 minutes
    </script>
</body>
</html>
