<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Controller</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .staff-body {
            background: var(--background-color);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .staff-layout {
            display: flex;
            width: 100vw;
            min-height: calc(100vh - 65px);
        }

        .staff-status-panel {
            flex: 1.5;
            background: radial-gradient(circle at top left, #11284d 0%, #050e1d 100%);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            padding: 3rem;
            position: relative;
        }

        .staff-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .staff-title {
            font-size: 2.2rem;
            color: var(--secondary-color);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .staff-subtitle {
            font-size: 1.1rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.5rem;
        }

        .status-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
            border-radius: 30px;
            padding: 3rem;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .status-label {
            font-size: 1.2rem;
            color: #a0aec0;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .status-number {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--secondary-color);
            text-shadow: 0 0 30px rgba(241, 196, 15, 0.3);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .status-name {
            font-size: 2.5rem;
            font-weight: 600;
            color: white;
            min-height: 3rem;
        }

        .priority-badge {
            display: inline-block;
            background: var(--secondary-color);
            color: var(--primary-color);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
        }

        .staff-controls-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 3rem;
            background: #030812;
        }

        .controls-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .btn {
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            padding: 1.5rem;
        }

        .btn:active { transform: scale(0.97); }

        .btn-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .btn-text { font-weight: 600; font-size: 1.3rem; }
        .btn-subtext { font-size: 0.9rem; opacity: 0.7; margin-top: 0.5rem; font-weight: 400; }

        .btn-next {
            background: linear-gradient(135deg, var(--success-color), var(--success-hover));
            padding: 3rem;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.2), inset 0 1px 1px rgba(255,255,255,0.3);
        }

        .btn-next .btn-icon { font-size: 3.5rem; }
        .btn-next .btn-text { font-size: 2.5rem; font-weight: 800; }
        .btn-next:hover { box-shadow: 0 15px 40px rgba(46, 204, 113, 0.4), inset 0 1px 1px rgba(255,255,255,0.3); transform: translateY(-3px); }

        .secondary-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .secondary-controls .btn { flex-direction: column; padding: 1.5rem 1rem; }

        .btn-recall { background: linear-gradient(135deg, var(--recall-color), var(--recall-hover)); }
        .btn-skip { background: linear-gradient(135deg, var(--skip-color), var(--skip-hover)); }
        .btn-reset { background: linear-gradient(135deg, var(--danger-color), var(--danger-hover)); }

        .waiting-list-panel {
            flex-grow: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .waiting-title {
            font-size: 1.2rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }

        .waiting-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            max-height: 400px;
            padding-right: 1rem;
        }

        .waiting-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .waiting-item.is-priority {
            border-left: 5px solid var(--secondary-color);
            background: linear-gradient(90deg, rgba(241,196,15,0.1) 0%, rgba(0,0,0,0.3) 100%);
        }

        .waiting-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .waiting-ccd {
            color: var(--secondary-color);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .waiting-name {
            color: white;
            font-weight: 500;
        }

        .waiting-badge {
            background: rgba(241, 196, 15, 0.2);
            color: var(--secondary-color);
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 1024px) {
            .staff-layout { flex-direction: column; }
            .staff-status-panel { padding: 2rem 1rem; border-right: none; border-bottom: 1px solid var(--border-color); }
            .status-card { padding: 2rem; }
            .status-number { font-size: 3rem; }
            .status-name { font-size: 1.8rem; }
            .staff-controls-panel { padding: 2rem 1rem; }
        }
    </style>
</head>
<body class="staff-body">
    <div class="staff-nav">
        <a href="/staff" class="nav-link active">Queue Dashboard</a>
        <a href="/records" class="nav-link">Database Records</a>
    </div>
    
    <div class="staff-layout">
        <!-- Left Panel: Status & Branding -->
        <div class="staff-status-panel">
            <div class="staff-header">
                <div class="staff-title">Controller Panel</div>
                <div class="staff-subtitle">NBI Queue Management System</div>
            </div>

            <div class="status-card">
                <div class="status-label">Currently Serving</div>
                <div id="priority-badge-container"></div>
                <div class="status-number" id="current-ccd">---</div>
                <div class="status-name" id="current-name">Waiting...</div>
            </div>
        </div>

        <!-- Right Panel: Controls -->
        <div class="staff-controls-panel">
            <div class="controls-wrapper">
                <button class="btn btn-next" id="btn-next">
                    <span class="btn-icon">➔</span>
                    <span class="btn-text">Call Next Number</span>
                    <span class="btn-subtext">Auto-pulls 2 Regulars : 1 Priority</span>
                </button>
                
                <div class="secondary-controls">
                    <button class="btn btn-recall" id="btn-recall">
                        <span class="btn-icon">↺</span>
                        <span class="btn-text">Recall</span>
                    </button>
                    <button class="btn btn-skip" id="btn-skip">
                        <span class="btn-icon">⏭</span>
                        <span class="btn-text">Skip</span>
                    </button>
                    <button class="btn btn-reset" id="btn-reset">
                        <span class="btn-icon">⚠</span>
                        <span class="btn-text">Reset</span>
                    </button>
                </div>
            </div>

            <!-- Waiting List -->
            <div class="waiting-list-panel">
                <div class="waiting-title">
                    <span>Live Waiting List</span>
                    <span id="waiting-count" style="color: white; font-weight: bold;">0 waiting</span>
                </div>
                <ul class="waiting-list" id="waiting-list">
                    <!-- Populated via JS -->
                </ul>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const currentCcdEl = document.getElementById('current-ccd');
        const currentNameEl = document.getElementById('current-name');
        const priorityBadgeEl = document.getElementById('priority-badge-container');
        const waitingListEl = document.getElementById('waiting-list');
        const waitingCountEl = document.getElementById('waiting-count');

        function shortenCcd(ccd) {
            if (!ccd || ccd === '---') return '---';
            const parts = ccd.split('-');
            if (parts.length > 1) {
                return '#' + parts[parts.length - 1];
            }
            return ccd;
        }

        function renderStaffState(data) {
            // Update currently serving
            if (data.currentlyServing) {
                currentCcdEl.textContent = shortenCcd(data.currentlyServing.ccdNo);
                currentNameEl.textContent = data.currentlyServing.fullName;
                if (data.currentlyServing.isPriority) {
                    priorityBadgeEl.innerHTML = '<span class="priority-badge">Priority PWD/Senior</span>';
                } else {
                    priorityBadgeEl.innerHTML = '';
                }
            } else {
                currentCcdEl.textContent = "---";
                currentNameEl.textContent = "Waiting...";
                priorityBadgeEl.innerHTML = '';
            }

            // Update waiting list
            waitingCountEl.textContent = `${data.waitingList.length} waiting`;
            waitingListEl.innerHTML = '';
            
            if (data.waitingList.length === 0) {
                waitingListEl.innerHTML = '<li style="color: #a0aec0; text-align: center; padding: 2rem;">No one is currently waiting.</li>';
            } else {
                data.waitingList.forEach(person => {
                    const li = document.createElement('li');
                    li.className = `waiting-item ${person.isPriority ? 'is-priority' : ''}`;
                    
                    let priorityHTML = person.isPriority ? '<div class="waiting-badge">Priority</div>' : '';
                    
                    li.innerHTML = `
                        <div class="waiting-info">
                            <span class="waiting-ccd">${shortenCcd(person.ccdNo)}</span>
                            <span class="waiting-name">${person.fullName}</span>
                        </div>
                        ${priorityHTML}
                    `;
                    waitingListEl.appendChild(li);
                });
            }
        }

        socket.on('staff_update', (data) => {
            renderStaffState(data);
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            socket.emit('next');
        });

        document.getElementById('btn-recall').addEventListener('click', () => {
            if (currentCcdEl.textContent !== '---') {
                socket.emit('recall');
            }
        });

        document.getElementById('btn-skip').addEventListener('click', () => {
            if (confirm('Are you sure you want to skip the current person?')) {
                socket.emit('skip');
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (confirm('Are you sure you want to completely clear the entire queue database?')) {
                socket.emit('reset');
            }
        });
    </script>
</body>
</html>
