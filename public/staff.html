<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Controller</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .staff-body {
            background: radial-gradient(circle at top, #11284d 0%, #050e1d 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .staff-nav {
            display: flex;
            justify-content: center;
            background: rgba(5, 14, 29, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .staff-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem 3rem;
        }

        .staff-header {
            text-align: center;
            margin-bottom: 2rem;
            margin-top: 1.5rem;
        }

        .staff-title { font-size: 2.5rem; color: var(--secondary-color); font-weight: 800; letter-spacing: 2px; text-transform: uppercase;}

        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
            width: 100%;
        }

        /* Top: Serving Section */
        .serving-card {
            text-align: center;
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
        }
        .card-label {
            font-size: 1.2rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 1.5rem;
        }
        .status-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .status-number {
            font-size: 6.5rem; font-weight: 800; color: var(--secondary-color);
            text-shadow: 0 0 40px rgba(241, 196, 15, 0.3); line-height: 1; margin-bottom: 0.5rem;
        }
        .status-name { font-size: 2.8rem; font-weight: 600; color: white; margin-bottom: 0.5rem;}

        .priority-badge {
            display: inline-block; background: var(--danger-color); color: white;
            padding: 0.5rem 1.5rem; border-radius: 50px; font-weight: 800; font-size: 1.1rem;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.4);
        }

        /* Middle: Controls Section */
        .controls-card {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 3rem;
        }
        .btn {
            border-radius: 15px; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            color: white; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-next {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.2), rgba(39, 174, 96, 0.1));
            border: 1px solid rgba(46, 204, 113, 0.5);
            padding: 2.5rem;
            width: 100%;
            flex-direction: column;
            gap: 1rem;
        }
        .btn-next:hover {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.4), rgba(39, 174, 96, 0.2));
            box-shadow: 0 10px 40px rgba(46, 204, 113, 0.4);
            transform: translateY(-3px);
        }
        .btn-next .btn-icon { font-size: 3.5rem; color: var(--success-color); margin-bottom: 0; }
        .btn-next .btn-text { font-size: 2.5rem; font-weight: 800; color: var(--success-color); }
        .btn-next .btn-subtext { font-size: 1.1rem; color: #a0aec0; margin-top: 0; }
        
        .secondary-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; width: 100%; }
        .secondary-controls .btn { padding: 1.5rem; flex-direction: row; gap: 1rem; background: rgba(255,255,255,0.05); }
        
        .btn-recall { border: 1px solid rgba(155, 89, 182, 0.4); }
        .btn-recall .btn-icon, .btn-recall .btn-text { color: var(--recall-color); }
        .btn-recall:hover { background: rgba(155, 89, 182, 0.2); box-shadow: 0 5px 20px rgba(155, 89, 182, 0.3); transform: translateY(-2px); }
        
        .btn-skip { border: 1px solid rgba(149, 165, 166, 0.4); }
        .btn-skip .btn-icon, .btn-skip .btn-text { color: var(--skip-color); }
        .btn-skip:hover { background: rgba(149, 165, 166, 0.2); box-shadow: 0 5px 20px rgba(149, 165, 166, 0.3); transform: translateY(-2px); }
        
        .btn-reset { border: 1px solid rgba(231, 76, 60, 0.4); }
        .btn-reset .btn-icon, .btn-reset .btn-text { color: var(--danger-color); }
        .btn-reset:hover { background: rgba(231, 76, 60, 0.2); box-shadow: 0 5px 20px rgba(231, 76, 60, 0.3); transform: translateY(-2px); }
        
        .btn .btn-text { font-size: 1.4rem; font-weight: 600; }
        .btn .btn-icon { font-size: 1.8rem; margin-bottom: 0; }

        /* Bottom: Waiting List */
        .waiting-card { padding: 2rem 3rem; height: 100%; display: flex; flex-direction: column; }
        .waiting-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color);
            font-size: 1.3rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1.5rem;
        }
        .waiting-count-badge { background: rgba(255,255,255,0.1); padding: 0.4rem 1.2rem; border-radius: 50px; color: white; font-weight: bold; }
        
        .waiting-list { list-style: none; padding: 0; margin: 0; max-height: 700px; overflow-y: auto; padding-right: 1rem; flex-grow: 1; }
        .waiting-item {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);
            padding: 1.2rem 2rem; border-radius: 12px; margin-bottom: 1rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .waiting-item.is-priority {
            border-left: 6px solid var(--danger-color);
            background: linear-gradient(90deg, rgba(231, 76, 60, 0.1) 0%, rgba(0,0,0,0.3) 100%);
        }
        .waiting-info { display: flex; flex-direction: column; gap: 0.4rem; }
        .waiting-ccd { color: var(--secondary-color); font-weight: 800; font-size: 1.3rem; }
        .waiting-name { color: white; font-weight: 500; font-size: 1.4rem; }
        .waiting-badge {
            background: rgba(231, 76, 60, 0.2); color: var(--danger-color);
            padding: 0.4rem 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px;
        }

        /* Responsive Overrides */
        @media (max-width: 1024px) {
            .dashboard-layout { grid-template-columns: 1fr; }
            .staff-container { max-width: 900px; }
            .waiting-list { max-height: 500px; }
        }
        @media (max-width: 768px) {
            .secondary-controls { grid-template-columns: 1fr; }
            .status-number { font-size: 4rem; }
            .status-name { font-size: 2rem; }
            .staff-container { padding: 5rem 1.5rem 2rem; }
            .controls-card { padding: 1.5rem; }
            .waiting-card { padding: 1.5rem; }
            .serving-card { padding: 1.5rem; }
        }
    </style>
</head>
<body class="staff-body">
    <div class="staff-nav">
        <a href="/staff" class="nav-link active">Queue Dashboard</a>
        <a href="/records" class="nav-link">Database Records</a>
    </div>
    
    <div class="staff-container">
        <div class="staff-header">
            <div class="staff-title">Controller Panel</div>
        </div>

        <div class="dashboard-layout">
            <div class="left-column">
                <!-- Currently Serving -->
                <div class="dashboard-card serving-card">
                    <div class="card-label">Currently Serving</div>
                    <div class="status-display">
                        <div id="priority-badge-container"></div>
                        <div class="status-number" id="current-ccd">---</div>
                        <div class="status-name" id="current-name">Waiting...</div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="dashboard-card controls-card">
                    <button class="btn btn-next" id="btn-next">
                        <span class="btn-icon">➔</span>
                        <span class="btn-text">Call Next Number</span>
                        <span class="btn-subtext">Absolute Priority Ordering</span>
                    </button>
                    
                    <div class="secondary-controls">
                        <button class="btn btn-recall" id="btn-recall">
                            <span class="btn-icon">↺</span>
                            <span class="btn-text">Recall</span>
                        </button>
                        <button class="btn btn-skip" id="btn-skip">
                            <span class="btn-icon">⏭</span>
                            <span class="btn-text">Skip</span>
                        </button>
                        <button class="btn btn-reset" id="btn-reset">
                            <span class="btn-icon">⚠</span>
                            <span class="btn-text">Reset</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="right-column">
                <!-- Queue Preview Panel -->
                <div class="dashboard-card preview-card" style="margin-bottom: 2rem;">
                    <div class="card-label" style="font-size: 1.1rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem;">Queue Preview (Next 5)</div>
                    <div id="queue-preview-container" style="display:flex; gap: 1rem; overflow-x: auto; padding-top: 0.5rem; padding-bottom: 0.5rem;">
                        <div style="color: #a0aec0;">Waiting...</div>
                    </div>
                </div>

                <!-- Waiting List -->
                <div class="dashboard-card waiting-card">
                    <div class="waiting-header">
                        <span>Live Waiting List</span>
                        <span id="waiting-count" class="waiting-count-badge">0 waiting</span>
                    </div>
                    <ul class="waiting-list" id="waiting-list">
                        <!-- Populated via JS -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const currentCcdEl = document.getElementById('current-ccd');
        const currentNameEl = document.getElementById('current-name');
        const priorityBadgeEl = document.getElementById('priority-badge-container');
        const waitingListEl = document.getElementById('waiting-list');
        const waitingCountEl = document.getElementById('waiting-count');

        function shortenCcd(ccd) {
            if (!ccd || ccd === '---') return '---';
            const parts = ccd.split('-');
            if (parts.length > 1) {
                return '#' + parts[parts.length - 1];
            }
            return ccd;
        }

        function renderStaffState(data) {
            // Update currently serving
            if (data.currentlyServing) {
                currentCcdEl.textContent = shortenCcd(data.currentlyServing.ccdNo);
                currentNameEl.textContent = data.currentlyServing.fullName;
                if (data.currentlyServing.isPriority) {
                    priorityBadgeEl.innerHTML = '<span class="priority-badge">Priority PWD/Senior</span>';
                } else {
                    priorityBadgeEl.innerHTML = '';
                }
            } else {
                currentCcdEl.textContent = "---";
                currentNameEl.textContent = "Waiting...";
                priorityBadgeEl.innerHTML = '';
            }

            // Update Queue Preview & Waiting List
            const previewEl = document.getElementById('queue-preview-container');
            previewEl.innerHTML = '';
            
            waitingCountEl.textContent = `${data.waitingList.length} waiting`;
            waitingListEl.innerHTML = '';
            
            if (data.waitingList.length === 0) {
                previewEl.innerHTML = '<div style="color: #a0aec0;">Queue is empty.</div>';
                waitingListEl.innerHTML = '<li style="color: #a0aec0; text-align: center; padding: 2rem;">No one is currently waiting.</li>';
            } else {
                // Populate Preview (next 5)
                const next5 = data.waitingList.slice(0, 5);
                next5.forEach((person, idx) => {
                    const card = document.createElement('div');
                    card.style.cssText = `min-width: 120px; background: rgba(0,0,0,0.3); border: 1px solid ${person.isPriority ? '#f39c12' : 'rgba(255,255,255,0.1)'}; padding: 1rem; border-radius: 8px; text-align: center;`;
                    card.innerHTML = `
                        <div style="font-size: 0.8rem; color: #a0aec0; margin-bottom: 0.5rem;">Next ${idx + 1}</div>
                        <div style="font-weight: bold; font-size: 1.2rem; color: ${person.isPriority ? '#f39c12' : 'white'};">${shortenCcd(person.ccdNo)}</div>
                    `;
                    previewEl.appendChild(card);
                });

                // Populate full list
                data.waitingList.forEach(person => {
                    const li = document.createElement('li');
                    li.className = `waiting-item ${person.isPriority ? 'is-priority' : ''}`;
                    
                    let priorityHTML = person.isPriority ? '<div class="waiting-badge">Priority</div>' : '';
                    
                    li.innerHTML = `
                        <div class="waiting-info">
                            <span class="waiting-ccd">${shortenCcd(person.ccdNo)}</span>
                            <span class="waiting-name">${person.fullName}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            ${priorityHTML}
                            <button onclick="socket.emit('serve_specific', '${person.id}')" style="background: rgba(46, 204, 113, 0.2); border: 1px solid rgba(46, 204, 113, 0.5); color: #2ecc71; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s;" onmouseover="this.style.background='rgba(46, 204, 113, 0.3)'" onmouseout="this.style.background='rgba(46, 204, 113, 0.2)'">Serve Now</button>
                        </div>
                    `;
                    waitingListEl.appendChild(li);
                });
            }
        }

        socket.on('staff_update', (data) => {
            renderStaffState(data);
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            socket.emit('next');
        });

        document.getElementById('btn-recall').addEventListener('click', () => {
            if (currentCcdEl.textContent !== '---') {
                socket.emit('recall');
            }
        });

        document.getElementById('btn-skip').addEventListener('click', () => {
            if (confirm('Are you sure you want to skip the current person?')) {
                socket.emit('skip');
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (confirm('Are you sure you want to completely clear the entire queue database?')) {
                socket.emit('reset');
            }
        });
    </script>
</body>
</html>
